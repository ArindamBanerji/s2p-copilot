name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out ci-platform
        uses: actions/checkout@v4
        with:
          repository: ArindamBanerji/ci-platform
          path: ci-platform

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ci-platform
          python -m pip install -e ".[dev]" pytest-timeout

      - name: Run backend tests
        run: cd backend && python -m pytest tests/ -q --timeout=120
