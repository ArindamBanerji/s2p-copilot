[project]
name = "s2p-copilot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "neo4j>=5.0.0",
    "numpy>=1.24.0",
    "graph-attention-engine @ git+https://github.com/ArindamBanerji/graph-attention-engine.git",
    # Also requires: pip install -e ../ci-platform
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "pytest-asyncio", "httpx"]

[tool.mypy]
python_version = "3.11"
mypy_path = ["$MYPY_CONFIG_FILE_DIR/backend", "$MYPY_CONFIG_FILE_DIR/../copilot-sdk", "$MYPY_CONFIG_FILE_DIR/../ci-platform", "$MYPY_CONFIG_FILE_DIR/../graph-attention-engine-v50"]
follow_imports = "skip"
warn_unused_configs = true
